name: Build FinxModMenu3 Dylib Direct

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos

    - name: Compile Dylib Directly
      run: |
        make
      env:
        THEOS: /Users/runner/theos

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinxModMenu3-Dylib
        path: .theos/obj/debug/FinxModMenu3.dylib
