name: Build FinxModMenu Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download iOS SDK
      run: |
        git clone --depth 1 https://github.com/hexip/iOS-SDKs.git sdks
        echo "SDKPATH=$PWD/sdks/iPhoneOS14.5.sdk" >> $GITHUB_ENV

    - name: Compile Dylib for iOS
      run: |
        echo "Starting compilation for iOS (arm64)..."
        clang -dynamiclib \
              -isysroot "$SDKPATH" \
              -target arm64-apple-ios14.0 \
              -framework UIKit \
              -framework Foundation \
              -o FinxModMenu.dylib src/main.m
        echo "Compilation finished successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinxModMenu-Dylib
        path: FinxModMenu.dylib
