name: Build FinxModMenu Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Dylib
      run: |
        echo "Starting compilation..."
        # تجميع ملف الكود المصدري وربطه بمكتبات أبل الأساسية UIKit و Foundation
        clang -dynamiclib -framework UIKit -framework Foundation -o FinxModMenu.dylib src/main.m
        echo "Compilation finished successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinxModMenu-Dylib
        path: FinxModMenu.dylib
